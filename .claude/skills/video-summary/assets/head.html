<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one reading column; a "lantern" accent (amber) marks actions, teal marks concepts. Light through a crack: the series' own image of recovery. */
:root{
  --bg:#F3F5F4; --surface:#E6ECEA; --ink:#14201F; --muted:#52615F; --rule:#CFD9D6;
  --teal:#136F63; --teal-soft:#D7EAE6; --amber:#9A5806; --amber-soft:#F5E6D0;
  --red:#A33B3B; --red-soft:#F4DEDC; --green:#2C7650; --green-soft:#DDEFE4;
  --f-display:"Cairo","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
  --f-body:"Cairo","Noto Sans Arabic",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1514; --surface:#15201F; --ink:#E3ECEA; --muted:#93A6A3; --rule:#253432;
  --teal:#5CC2B1; --teal-soft:#12302C; --amber:#E8A84A; --amber-soft:#2E2213;
  --red:#EE8A84; --red-soft:#2C1716; --green:#69C495; --green-soft:#132A1F; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1514; --surface:#15201F; --ink:#E3ECEA; --muted:#93A6A3; --rule:#253432;
  --teal:#5CC2B1; --teal-soft:#12302C; --amber:#E8A84A; --amber-soft:#2E2213;
  --red:#EE8A84; --red-soft:#2C1716; --green:#69C495; --green-soft:#132A1F; color-scheme:dark;}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.85;font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{direction:rtl;max-width:900px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.4;margin:0;font-weight:700}
h2{font-size:clamp(1.6rem,1.2rem + 1.5vw,2.1rem)}
h3{font-size:1.25rem}
h4{font-size:1.05rem}
p{margin:0}
a{color:var(--teal)}
a:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

header.top{padding-block:40px 24px;display:grid;gap:14px}
.eyebrow{font-size:.82rem;letter-spacing:.04em;color:var(--amber);font-weight:600}
h1{font-size:clamp(2.2rem,1.4rem + 3.2vw,3.3rem)}
.lede{font-size:1.06rem;color:var(--muted);max-width:64ch}
.coverage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;align-items:center;background:var(--surface);border-radius:12px;padding:14px 16px}
.coverage .big{font-family:var(--f-display);font-size:2rem;line-height:1;color:var(--teal);grid-row:span 2}
.coverage .bar{height:8px;background:var(--rule);border-radius:99px;overflow:hidden}
.coverage .bar i{display:block;height:100%;width:37.5%;background:var(--teal);border-radius:99px}
.coverage p{font-size:.9rem;color:var(--muted)}

nav.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
nav.toc ul{list-style:none;margin:0;padding:10px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav.toc a{display:block;white-space:nowrap;text-decoration:none;color:var(--ink);font-size:.92rem;padding:5px 14px;border-radius:999px;border:1px solid var(--rule)}
nav.toc a:hover{border-color:var(--teal);color:var(--teal)}

section.block{padding-top:48px;display:grid;gap:20px;scroll-margin-top:60px}
.sec-head{display:grid;gap:6px}
.sec-head p{color:var(--muted);max-width:66ch}

/* themes */
.theme{border-top:1px solid var(--rule);padding-top:22px;display:grid;gap:10px}
.theme-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.theme-head .idx{font-family:var(--f-display);color:var(--amber);font-size:1.1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{font-size:.8rem;text-decoration:none;padding:2px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
.chips a:hover{text-decoration:underline}
.theme ul{margin:0;padding-inline-start:20px;display:grid;gap:6px;max-width:70ch}
.theme ul li::marker{color:var(--teal)}
.key{background:var(--teal-soft);border-radius:10px;padding:10px 14px;font-weight:500;max-width:70ch}
.key b{color:var(--teal)}

/* tree */
.tree-wrap{overflow-x:auto}
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding-inline-start:22px;border-inline-start:2px solid var(--rule)}
.tree li{position:relative;padding-block:3px}
.tree ul > li::before{content:"";position:absolute;inset-inline-start:-22px;top:1.05em;width:16px;border-top:2px solid var(--rule)}
.tree .root{display:inline-block;font-family:var(--f-display);font-size:1.35rem;background:var(--ink);color:var(--bg);padding:6px 18px;border-radius:999px;margin-bottom:6px}
.tree .br{font-family:var(--f-display);font-size:1.08rem;color:var(--teal)}
.tree .lf{font-size:.95rem}
.tree .lf b{color:var(--amber);font-weight:600}

/* research */
.res{display:grid;gap:12px}
.rcard{border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.rcard .claim{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.rcard .claim h4{flex:1 1 260px}
.pill{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.mix{background:var(--amber-soft);color:var(--amber)}
.pill.no{background:var(--red-soft);color:var(--red)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rgrid > div{border-radius:8px;padding:10px 12px;font-size:.92rem;min-width:0}
.rgrid .pro{background:var(--green-soft)}
.rgrid .con{background:var(--red-soft)}
.rgrid .lbl{display:block;font-weight:600;font-size:.8rem;margin-bottom:2px}
.rgrid .pro .lbl{color:var(--green)}
.rgrid .con .lbl{color:var(--red)}
.rcard .bottom{font-size:.92rem}
.rcard .bottom b{color:var(--teal)}
@media (max-width:620px){.rgrid{grid-template-columns:1fr}}
.cite{font-size:.82rem;color:var(--muted)}

/* actions */
.path{counter-reset:p;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.path > li{counter-increment:p;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border-radius:12px;padding:12px 14px}
.path > li::before{content:counter(p);display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--amber);color:var(--bg);font-weight:600;font-variant-numeric:tabular-nums}
.path b{display:block;font-family:var(--f-display);font-size:1.05rem}
.path span{font-size:.93rem}
.acard{border:1px solid var(--rule);border-radius:12px;padding:16px;display:grid;gap:10px}
.acard h3{display:flex;gap:10px;align-items:baseline}
.acard h3 .tag{font-family:var(--f-body);font-size:.75rem;font-weight:600;color:var(--amber);background:var(--amber-soft);padding:1px 8px;border-radius:999px}
.acard ul,.acard ol{margin:0;padding-inline-start:20px;display:grid;gap:5px}
.acard li::marker{color:var(--amber);font-variant-numeric:tabular-nums}
.acard .src{font-size:.78rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:.92rem}
th,td{text-align:start;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--rule)}
th{background:var(--surface);font-weight:600;font-size:.85rem}
tr:last-child td{border-bottom:0}
td.old{color:var(--red)}
td.new{color:var(--green);font-weight:500}
td.v{font-size:.78rem;color:var(--muted);white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two > div{border-radius:10px;padding:12px 14px;min-width:0}
.two .bad{background:var(--red-soft)}
.two .good{background:var(--green-soft)}
.two h4{margin-bottom:4px}
.two .bad h4{color:var(--red)}
.two .good h4{color:var(--green)}
.two ul{margin:0;padding-inline-start:18px;display:grid;gap:4px;font-size:.93rem}
@media (max-width:620px){.two{grid-template-columns:1fr}}
.note{font-size:.88rem;color:var(--muted);border-inline-start:3px solid var(--amber);padding-inline-start:12px}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);font-size:.85rem;color:var(--muted);display:grid;gap:8px}
footer details summary{cursor:pointer;color:var(--ink);font-weight:500}
footer ul{margin:6px 0 0;padding-inline-start:18px;columns:2;column-gap:28px}
@media (max-width:560px){footer ul{columns:1}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
@page{size:A4;margin:14mm 12mm}
@media print{
  nav.toc,body::before,button,#score{display:none!important}
  .wrap{max-width:none;padding-left:0;padding-right:0}
  section.block{padding-top:20px}
  h2,h3,h4{break-after:avoid}
  .rcard,.qa,fieldset,.path>li,.acard li,tr,.theme-head,.key,.two{break-inside:avoid}
  a{color:inherit;text-decoration:none}
}
</style>
